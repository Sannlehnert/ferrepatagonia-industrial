name: CI Build, Types and Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (Node 22 + MariaDB + E2E & Cleanup)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run security audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Type check backend
        working-directory: backend
        run: npm run type-check

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend unit tests
        working-directory: backend
        run: npm run test:unit

      - name: Run backend DTO source tests
        working-directory: backend
        run: npm run test:dto-source

      - name: Run backend MariaDB integration tests
        working-directory: backend
        run: npm run test:integration

      - name: Run E2E cleanup validation tests
        run: node --test backend/test/e2e-cleanup.test.cjs

  frontend-ci:
    name: Frontend CI (Node 22 + Vite + Playwright E2E)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Type check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Run frontend unit/component tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run integrated E2E suite
        run: node backend/test/helpers/run-e2e.cjs

      - name: Verify clean Docker state
        if: always()
        run: |
          echo "Contenedores activos restantes:"
          docker ps -a
          echo "Volúmenes Docker restantes:"
          docker volume ls
